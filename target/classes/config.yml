# RockPaperScissorsPro Configuration v2.1

cooldown:
  enabled: true
  duration: 30

challenge:
  timeout: 60

countdown:
  duration: 3

tie:
  max-replays: 3

# -----------------------------------------------------------------------
# Choice selection GUI (27 slots, appears when a match starts)
# Slot numbering: 0-26 left-to-right, top-to-bottom in a 9x3 grid.
# -----------------------------------------------------------------------
gui:
  title: "&8[&c&lRPS&8] &7vs &e%opponent%"

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

  rock:
    material: COBBLESTONE
    slot: 11
    name: "&7&lROCK"
    lore:
      - ""
      - "&8Beats Scissors"
      - "&8Loses to Paper"
      - ""
      - "&eClick to select!"

  paper:
    material: PAPER
    slot: 13
    name: "&f&lPAPER"
    lore:
      - ""
      - "&8Beats Rock"
      - "&8Loses to Scissors"
      - ""
      - "&eClick to select!"

  scissors:
    material: SHEARS
    slot: 15
    name: "&c&lSCISSORS"
    lore:
      - ""
      - "&8Beats Paper"
      - "&8Loses to Rock"
      - ""
      - "&eClick to select!"

# -----------------------------------------------------------------------
# Games browser GUI (54 slots, opened with /rps games)
# Slot numbering: 0-53 left-to-right, top-to-bottom in a 9x6 grid.
#
# Default layout (B=border filler, G=game slot, P=prev, S=stats, N=next):
#   B B B B B B B B B   (row 0,  slots  0- 8)
#   B G G G G G G G B   (row 1,  slots  9-17)
#   B G G G G G G G B   (row 2,  slots 18-26)
#   B G G G G G G G B   (row 3,  slots 27-35)
#   B G G G G G G G B   (row 4,  slots 36-44)
#   P B B B S B B B N   (row 5,  slots 45-53)
# -----------------------------------------------------------------------
games-gui:
  title: "&8[&c&lRPS&8] &6&lAVAILABLE GAMES"

  # Slots where game entries are displayed (28 inner slots by default)
  game-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43

  # Navigation and utility slots
  prev-page-slot: 45
  stats-slot: 49
  next-page-slot: 53

  # Filler item (fills every slot not occupied by a game, nav, or stats item)
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

  # Stats book shown in the bottom bar
  stats:
    material: BOOK
    name: "&6&lSTATS"

  # Previous page button
  prev-page:
    material: ARROW
    name: "&7« Previous Page"

  # Next page button
  next-page:
    material: ARROW
    name: "&7Next Page »"

  # Shown when there are no open games
  no-games:
    material: BARRIER
    name: "&cNo games available"
    lore:
      - ""
      - "&7Be the first — use &e/rps create <amount>"

  # Shown for the viewing player's own game (click = cancel)
  your-game:
    name: "&a&lYOUR GAME"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - "&7Payout if you win: &a$%winnings%"
      - ""
      - "&c▶ Click to CANCEL"

  # Shown for another player's game (click = join)
  other-game:
    name: "&6%player%"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - "&7Payout if you win: &a$%winnings%"
      - ""
      - "&a▶ Click to PLAY!"

  # Shown when a game's creator has gone offline or is now in a match
  unavailable-game:
    name: "&c&lNOT AVAILABLE"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - ""
      - "&cThis game is no longer available."

# -----------------------------------------------------------------------
# Lobby settings
# -----------------------------------------------------------------------
lobby:
  # Seconds before an unclaimed lobby auto-expires (0 = never)
  timeout: 300

sounds:
  challenge-sent: ENTITY_PLAYER_LEVELUP
  challenge-accepted: ENTITY_EXPERIENCE_ORB_PICKUP
  countdown: BLOCK_NOTE_BLOCK_PLING
  selection-made: BLOCK_STONE_BUTTON_CLICK_ON
  win: ENTITY_PLAYER_LEVELUP
  lose: ENTITY_VILLAGER_NO
  tie: BLOCK_NOTE_BLOCK_BASS

sound-settings:
  challenge-sent:
    volume: 1.0
    pitch: 1.0
  challenge-accepted:
    volume: 1.0
    pitch: 1.0
  countdown:
    volume: 0.8
    pitch: 1.2
  selection-made:
    volume: 1.0
    pitch: 1.0
  win:
    volume: 1.0
    pitch: 1.2
  lose:
    volume: 1.0
    pitch: 0.8
  tie:
    volume: 1.0
    pitch: 1.0

rewards:
  enabled: true
  win:
    enabled: true
    commands:
      - "broadcast &e%winner% &abeat &c%loser% &ain Rock Paper Scissors!"
  participation:
    enabled: false
    commands: []

betting:
  enabled: true
  min-bet: 100
  # Set to 0 for no upper limit
  max-bet: 0
  # Console command to deduct money. Placeholders: %player% %amount%
  take-command: "eco take %player% %amount%"
  # Console command to give money. Placeholders: %player% %amount%
  give-command: "eco give %player% %amount%"
