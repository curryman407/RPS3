# RockPaperScissorsPro Config
# Version 2.1
# Made by CurryMan for Clever Teaching

cooldown:
  enabled: true
  duration: 30

challenge:
  timeout: 60

countdown:
  duration: 3

tie:
  max-replays: 3


gui:
  title: "&8[&c&lRPS&8] &7vs &e%opponent%"

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

  rock:
    material: COBBLESTONE
    slot: 11
    name: "&7&lROCK"
    lore:
      - ""
      - "&8Beats Scissors"
      - "&8Loses to Paper"
      - ""
      - "&eClick to select!"

  paper:
    material: PAPER
    slot: 13
    name: "&f&lPAPER"
    lore:
      - ""
      - "&8Beats Rock"
      - "&8Loses to Scissors"
      - ""
      - "&eClick to select!"

  scissors:
    material: SHEARS
    slot: 15
    name: "&c&lSCISSORS"
    lore:
      - ""
      - "&8Beats Paper"
      - "&8Loses to Rock"
      - ""
      - "&eClick to select!"


games-gui:
  title: "&8[&c&lRPS&8] &6&lAVAILABLE GAMES"

  game-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43

  prev-page-slot: 45
  stats-slot: 49
  next-page-slot: 53

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

  stats:
    material: BOOK
    name: "&6&lSTATS"

  prev-page:
    material: ARROW
    name: "&7« Previous Page"

  next-page:
    material: ARROW
    name: "&7Next Page »"

  no-games:
    material: BARRIER
    name: "&cNo games available"
    lore:
      - ""
      - "&7Be the first — use &e/rps create <amount>"

  your-game:
    name: "&a&lYOUR GAME"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - "&7Payout if you win: &a$%winnings%"
      - ""
      - "&c▶ Click to CANCEL"

  other-game:
    name: "&6%player%"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - "&7Payout if you win: &a$%winnings%"
      - ""
      - "&a▶ Click to PLAY!"

  unavailable-game:
    name: "&c&lNOT AVAILABLE"
    lore:
      - ""
      - "&7Bet: &e$%amount%"
      - ""
      - "&cThis game is no longer available."

#lobby is basically the public games players can create

lobby:
  timeout: 300

sounds:
  challenge-sent: ENTITY_PLAYER_LEVELUP
  challenge-accepted: ENTITY_EXPERIENCE_ORB_PICKUP
  countdown: BLOCK_NOTE_BLOCK_PLING
  selection-made: BLOCK_STONE_BUTTON_CLICK_ON
  win: ENTITY_PLAYER_LEVELUP
  lose: ENTITY_VILLAGER_NO
  tie: BLOCK_NOTE_BLOCK_BASS

sound-settings:
  challenge-sent:
    volume: 1.0
    pitch: 1.0
  challenge-accepted:
    volume: 1.0
    pitch: 1.0
  countdown:
    volume: 0.8
    pitch: 1.2
  selection-made:
    volume: 1.0
    pitch: 1.0
  win:
    volume: 1.0
    pitch: 1.2
  lose:
    volume: 1.0
    pitch: 0.8
  tie:
    volume: 1.0
    pitch: 1.0

rewards:
  enabled: true
  win:
    enabled: true
    commands:
      - "broadcast &e%winner% &abeat &c%loser% &ain Rock Paper Scissors!"
  participation:
    enabled: false
    commands: []

betting:
  enabled: true
  min-bet: 100
  max-bet: 0
  take-command: "eco take %player% %amount%"
  give-command: "eco give %player% %amount%"
